services:
  - type: web
    name: llm-quiz-system
    env: node
    region: singapore
    plan: free
    buildCommand: apt-get update && apt-get install -y chromium chromium-driver && npm install
    startCommand: npm start
    envVars:
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: true
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: NODE_ENV
        value: production
